packages:
  - 'apps/*'
  - 'packages/*'

# Install scripts are blocked by default. Only packages listed here may run them.
# esbuild is required by Vitest and links its platform binary during install.
# @parcel/watcher (Metro's native file watcher) and unrs-resolver (a transitive
# dependency of eslint-config-expo's import resolution) arrived with apps/driver-app.
allowBuilds:
  '@parcel/watcher': true
  cpu-features: true
  esbuild: true
  protobufjs: true
  simple-git-hooks: true
  ssh2: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.27'
  - '@expo/router-server@57.0.11'
  - babel-preset-expo@57.0.13
  - expo-modules-core@57.0.19
  - expo-modules-jsi@57.1.1
  - expo@57.0.25
  - '@expo/ui@57.0.20'
  - expo-glass-effect@57.0.4
  - expo-linking@57.0.11
  - expo-location@57.0.20
  - expo-notifications@57.0.21
  - expo-router@57.0.23
