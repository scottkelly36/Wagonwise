name: wagonwise

services:
  # Local Postgres + PostGIS. Credentials match config.ts's DATABASE_URL default, so
  # `pnpm db:up && pnpm db:migrate` needs no .env at all — the README's cold-start promise.
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: wagonwise
      POSTGRES_PASSWORD: wagonwise
      POSTGRES_DB: wagonwise
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wagonwise -d wagonwise']
      interval: 2s
      timeout: 3s
      retries: 30

  # Self-hosted truck routing (decision: Valhalla behind a RoutingEngine port, design doc §4).
  # Not started by `pnpm db:up` — it has nothing to route with until you provide an extract, and
  # nothing needs it before M2. To bring it up:
  #   1. Download a Northumberland (or Great Britain) .osm.pbf extract from Geofabrik into
  #      infra/docker/custom_files/ (gitignored — large binary, never commit it). The image scans
  #      this one directory for *.pbf input AND writes tiles/config/admin/timezone dbs into it —
  #      it does not use a separate input mount, so both must be the same host directory.
  #   2. docker compose -f infra/docker/compose.yml --profile valhalla up -d valhalla
  #      First start builds tiles from the extract (a few minutes for a county-sized extract),
  #      which land in infra/docker/custom_files/valhalla_tiles/ (gitignored); later starts reuse
  #      them via use_tiles_ignore_pbf.
  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    restart: unless-stopped
    profiles: ['valhalla']
    ports:
      - '8002:8002'
    volumes:
      - ./custom_files:/custom_files
    environment:
      tile_urls: ''
      use_tiles_ignore_pbf: 'True'
      build_elevation: 'False'
      build_admins: 'True'
      build_time_zones: 'True'
      force_rebuild: 'False'
    # A first-time tile build can take several minutes (M2.1: ~3.5 for the Northumberland
    # extract), so this needs real patience, not a short default — lets `docker compose up --wait`
    # (or CI) block until Valhalla is actually serving, rather than guessing a sleep duration.
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:8002/status']
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 10s

volumes:
  postgres_data:
