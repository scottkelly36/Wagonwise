# DigitalOcean App Platform spec for `core` + `driver-bff`, created via:
#   doctl apps create --spec infra/digitalocean/app-spec.yaml
#
# No secrets in this file on purpose — env vars (DATABASE_URL, IDENTITY_PRIVATE_KEY,
# INTERNAL_KEYS/CORE_INTERNAL_KEY, VALHALLA_URL, ANTHROPIC_API_KEY, CLICKSEND_USERNAME,
# CLICKSEND_API_KEY) get added after creation, via the DO console's per-component
# "Environment variables" panel or `doctl apps update`, never written here or committed.
# See docs/deployment-guide.md for the full checklist, including §7 bug #3: the `vpc` field
# below is required for `core` to reach the Valhalla droplet's private IP at all — without it
# the app has no route into the droplet's VPC and every routing request times out.
name: wagonwise-backend
region: lon1
vpc:
  id: 1b4663cb-c8eb-490e-ab64-9027c1dcac83 # default-lon1, same VPC as the Valhalla droplet
domains:
  - domain: api.wagon-wise.co.uk
    type: PRIMARY
jobs:
  # Runs once before core/driver-bff's new deployment goes live (DO App Platform's PRE_DEPLOY
  # job kind) — if this fails, the deploy aborts and the old version stays up, so a bad migration
  # never reaches running code. Same image as `core` (needs the same migrations/ directory and
  # workspace install), just a different entrypoint. Automates the step that used to be a manual
  # `pnpm db:migrate` run against the managed DB after every deploy that added a migration
  # (docs/deployment-guide.md §4 step 2/§7's "0012"/"0013" migrations, done by hand each time).
  - name: migrate
    github:
      repo: scottkelly36/Wagonwise
      branch: main
      deploy_on_push: true
    dockerfile_path: apps/core/Dockerfile
    source_dir: /
    kind: PRE_DEPLOY
    run_command: pnpm --filter @wagonwise/core run db:migrate
    instance_size_slug: basic-xxs
    instance_count: 1
    envs:
      - key: NODE_ENV
        scope: RUN_AND_BUILD_TIME
        value: production
      # DATABASE_URL is set as an encrypted env var on this job specifically (DO console or
      # `doctl apps update`), same as on `core` — job components don't inherit another
      # component's env vars automatically, even within the same app.
services:
  - name: core
    github:
      repo: scottkelly36/Wagonwise
      branch: main
      deploy_on_push: true
    dockerfile_path: apps/core/Dockerfile
    source_dir: /
    internal_ports:
      - 3001
    instance_size_slug: basic-xxs
    instance_count: 1
    health_check:
      http_path: /health
      port: 3001
    envs:
      - key: HOST
        scope: RUN_AND_BUILD_TIME
        value: 0.0.0.0
      - key: NODE_ENV
        scope: RUN_AND_BUILD_TIME
        value: production
  - name: driver-bff
    github:
      repo: scottkelly36/Wagonwise
      branch: main
      deploy_on_push: true
    dockerfile_path: apps/driver-bff/Dockerfile
    source_dir: /
    http_port: 3002
    routes:
      - path: /
    instance_size_slug: basic-xxs
    instance_count: 1
    health_check:
      http_path: /health
      port: 3002
    envs:
      - key: HOST
        scope: RUN_AND_BUILD_TIME
        value: 0.0.0.0
      - key: NODE_ENV
        scope: RUN_AND_BUILD_TIME
        value: production
