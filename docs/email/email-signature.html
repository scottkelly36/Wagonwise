<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WagonWise email signature</title>
  </head>
  <!--
    The signature on its own, for quick replies where the full layout (email-template.html) is too much.
    How to use it: docs/email/README.md. Replace everything in [brackets].
  -->
  <body style="margin: 0; padding: 16px; background: #ffffff">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0">
      <tr>
        <td valign="top" style="padding: 2px 14px 0 0">
          <img
            src="https://wagon-wise.co.uk/img/icon-192.png"
            width="48"
            height="48"
            alt="WagonWise"
            style="display: block; border: 0; border-radius: 12px"
          />
        </td>
        <td
          valign="top"
          style="
            border-left: 3px solid #1a73e8;
            padding: 0 0 0 14px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 13px;
            line-height: 20px;
            color: #55617a;
          "
        >
          <span style="font-size: 15px; line-height: 22px; font-weight: 700; color: #0f1a2e"
            >[Your name]</span
          ><br />
          [Your role], WagonWise<br />
          [Phone number] &nbsp;|&nbsp;
          <a href="mailto:support@wagon-wise.co.uk" style="color: #1a73e8; text-decoration: none"
            >support@wagon-wise.co.uk</a
          ><br />
          <a href="https://wagon-wise.co.uk" style="color: #1a73e8; text-decoration: none"
            >wagon-wise.co.uk</a
          >
          &nbsp;|&nbsp; Navigation made for HGV drivers
        </td>
      </tr>
      <tr>
        <td
          colspan="2"
          style="
            padding-top: 12px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 11px;
            line-height: 16px;
            color: #8a94a8;
          "
        >
          WagonWise Ltd. Registered in England and Wales, company number 17530209.<br />
          Registered office: 5 Portland Terrace, Hexham NE46 3DT.
        </td>
      </tr>
    </table>
  </body>
</html>
