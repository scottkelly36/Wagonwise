name: CI

# Per-PR tier (decision 13, docs/progress.md): lint, typecheck, architecture, unit and
# application tests, and PostGIS integration tests (via Testcontainers — needs Docker, which
# GitHub-hosted ubuntu runners provide out of the box; nothing here needs `pnpm db:up`, since
# every Postgres-backed test spins up its own ephemeral container). Valhalla golden routes are
# explicitly NOT here — they run nightly instead (nightly-golden-routes.yml, M2.6), since
# building tiles takes minutes, too slow to pay on every push.
# It runs on pull requests only, not again on main after the merge: that second run tested the same code and used up the
# free Actions minutes (found 2026-10-09). To check main by hand: Actions, CI, Run workflow.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads the pinned version from package.json's packageManager field — one source of
      # truth, same as README's "pnpm is managed by corepack" convention.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same five checks as the README's cold-start verification command, as separate steps so
      # a failure is obvious at a glance rather than buried in one long `&&` chain's output.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # The release workflow's own rules and checks (.github/scripts), tested like any other code.
      - name: CI script tests
        run: pnpm test:ci-scripts

      - name: Architecture rules
        run: pnpm arch

      - name: Format check
        run: pnpm format:check
