name: Driver app release

# Merging to main never releases the driver app by itself. Adding the `release` label to a pull request
# publishes the driver app to production:
#
#   - labelled before it merges: releases when it merges, if CI passed on the pull request
#   - labelled after it merged:  releases main as it is now, if CI passed on that pull request
#
# "Release" always means "publish main as it is now", never an older commit, which could undo a newer
# over-the-air update. What goes out is everything on main since the last release (the
# driver-app/production tag), so earlier unlabelled merges ride along; the run summary lists them.
#
#   - JavaScript-only (the app version is unchanged): eas update to the production channel.
#   - Native (the version in apps/driver-app/app.config.ts is higher than at the last release): builds
#     the Android app and uploads it to Google Play's internal testing track. Promoting it to a wider
#     track stays a deliberate step in Play Console.
#   - Nothing in the app changed, or no label: nothing is published, and the run summary says why.
#
# It can also be run by hand (Actions, Driver app release, Run workflow): "check" proves the secrets
# work without publishing anything; "update" and "build" release regardless of the label (this is also
# how the very first release creates the tag). The rules are in .github/scripts/release-decision.mjs
# and are tested.
#
# Secrets needed (see docs/deployment-guide.md, "Automated app releases"):
#   EXPO_TOKEN                        an Expo access token
#   GOOGLE_PLAY_SERVICE_ACCOUNT_JSON  the Google Play service account key (the whole JSON)
# It no longer waits for a CI run on main (there is none; see ci.yml): it checks the pull request's own CI run.
on:
  pull_request:
    types: [labeled, closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: check (prove the secrets work, publish nothing), update (publish an over-the-air update), build (build and upload to Play internal testing)
        type: choice
        options: [check, update, build]
        default: check

permissions:
  contents: read
  pull-requests: read

# One release at a time, and never cancel one halfway through a build or an upload.
concurrency:
  group: driver-app-release
  cancel-in-progress: false

env:
  # What to release: the commit CI just passed (the labelled pull request merging), main's tip (the
  # label added to a pull request that had already merged), or the commit a manual run started on.
  RELEASE_REF: ${{ (github.event_name == 'pull_request' && 'main') || github.sha }}
  TRIGGER: ${{ github.event_name == 'pull_request' && 'label' || 'manual' }}
  # The commit whose CI run must have passed: the pull request's last commit.
  CI_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  decide:
    # Only the release label on a merged pull request counts: the label being added to one that has merged, or one that
    # carries it being merged. Any other pull request closing skips this job, so it costs no minutes.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
        ((github.event.action == 'labeled' && github.event.label.name == 'release') ||
         (github.event.action == 'closed' && contains(github.event.pull_request.labels.*.name, 'release'))))
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.decide.outputs.kind }}
      sha: ${{ steps.decide.outputs.sha }}
      # Until the owner has added the secrets, a release is skipped with a note, not failed.
      configured: ${{ steps.configured.outputs.configured }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Decide what to release
        id: decide
        run: node .github/scripts/decide-release.mjs
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'release' }}
          GH_TOKEN: ${{ github.token }}

      - name: Is the release set up?
        id: configured
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            if [ "${{ steps.decide.outputs.kind }}" = "update" ] || [ "${{ steps.decide.outputs.kind }}" = "build" ]; then
              echo "> **Not published:** the EXPO_TOKEN secret is not set yet, so nothing was released. See docs/deployment-guide.md, section 9." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  check:
    needs: decide
    if: needs.decide.outputs.kind == 'check'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.decide.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Check the release setup
        run: node .github/scripts/check-release-setup.mjs
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

  update:
    needs: decide
    if: needs.decide.outputs.kind == 'update' && needs.decide.outputs.configured == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to move the driver-app/production tag
    env:
      RELEASE_SHA: ${{ needs.decide.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.decide.outputs.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: pnpm install --frozen-lockfile

      # The server deploys separately and may finish after CI. Publishing an app that calls a route
      # that is not live yet would break it for every driver, so wait for the routes it needs.
      - name: Wait for the server to have what the app needs
        run: node .github/scripts/wait-for-api.mjs

      - name: Publish the over-the-air update
        working-directory: apps/driver-app
        run: |
          eas update --channel production --environment production --non-interactive \
            --message "$(git log -1 --format=%s "$RELEASE_SHA")"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Record what is now in production
        run: |
          git tag -f driver-app/production "$RELEASE_SHA"
          git push --force origin refs/tags/driver-app/production

      - name: Summary
        run: |
          {
            echo "## Over-the-air update published"
            echo
            echo "Commit \`${RELEASE_SHA::7}\` is on the production channel. Phones pick it up the next time the app opens (it may apply on the launch after that)."
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: decide
    if: needs.decide.outputs.kind == 'build' && needs.decide.outputs.configured == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to move the driver-app/production tag
    env:
      RELEASE_SHA: ${{ needs.decide.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.decide.outputs.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: pnpm install --frozen-lockfile

      # Fail early, in plain words, if the Google key is missing or malformed, rather than after a
      # twenty-minute build.
      - name: Check the Google Play key before building
        run: node .github/scripts/check-release-setup.mjs
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

      # The key is written for the build's own upload step and removed afterwards. The file is
      # git-ignored and referenced by eas.json's submit profile.
      - name: Write the Google Play key
        working-directory: apps/driver-app
        run: |
          umask 077
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > google-play-service-account.json
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

      - name: Build the Android app and upload it to Play internal testing
        working-directory: apps/driver-app
        run: eas build --platform android --profile production --non-interactive --wait --auto-submit
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Remove the Google Play key
        if: always()
        working-directory: apps/driver-app
        run: rm -f google-play-service-account.json

      - name: Record what is now in production
        run: |
          git tag -f driver-app/production "$RELEASE_SHA"
          git push --force origin refs/tags/driver-app/production

      - name: Summary
        run: |
          {
            echo "## Android build uploaded to Play internal testing"
            echo
            echo "Commit \`${RELEASE_SHA::7}\`. Open Play Console, Testing, Internal testing, check the new release, and promote it when you are happy."
          } >> "$GITHUB_STEP_SUMMARY"
